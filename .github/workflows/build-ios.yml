name: Build iPhone runtime probe

# Only an explicit manual run starts a macOS job.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Read the test project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the foreground test app
        run: python3 build_ios.py
      - name: Upload the test package and build report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iphone-runtime-probe
          path: |
            dist/MobileRuntimeProbe.ipa
            dist/build-report.json
          if-no-files-found: error
          retention-days: 7
