name: Build iPhone ReplayKit reading probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build and sign the ReplayKit test app
        run: |
          set -euo pipefail
          app=dist/Payload/ReplayScreenProbe.app
          extension="$app/PlugIns/ScreenReader.appex"
          mkdir -p "$extension"
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 \
            -fobjc-arc -O2 -Wno-deprecated-declarations -framework UIKit -framework Foundation \
            -framework ReplayKit -framework CoreGraphics \
            replaykit-probe/ReplayScreenProbe.m -o "$app/ReplayScreenProbe"
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 \
            -fobjc-arc -fapplication-extension -O2 -Wno-deprecated-declarations \
            -Wl,-e,_NSExtensionMain -framework Foundation -framework ReplayKit \
            -framework CoreMedia -framework CoreVideo -framework ImageIO -framework Vision \
            replaykit-probe/SampleHandler.m -o "$extension/ScreenReader"
          python3 replaykit-probe/package.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: iphone-replaykit-probe
          path: |
            dist/ReplayScreenProbe.ipa
            dist/report.json
          if-no-files-found: error
          retention-days: 7
