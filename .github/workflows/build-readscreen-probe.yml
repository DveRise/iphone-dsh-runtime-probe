name: Build read-only iPhone screen probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build and sign the SpringBoard probe
        run: |
          set -euo pipefail
          mkdir -p dist
          xcrun --sdk iphoneos clang -dynamiclib -arch arm64 -arch arm64e \
            -miphoneos-version-min=15.0 -fobjc-arc -fvisibility=hidden -O2 \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            -framework IOSurface -framework Vision \
            control-probe/ReadScreenProbe.m -o dist/iPhoneHarnessReadScreen.dylib
          codesign --force --sign - --timestamp=none dist/iPhoneHarnessReadScreen.dylib
          python3 control-probe/package.py dist/iPhoneHarnessReadScreen.dylib dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: iphone-readscreen-probe
          path: |
            dist/*.deb
            dist/report.json
          if-no-files-found: error
          retention-days: 7
